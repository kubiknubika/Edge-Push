  const hb = $('#hookBtn'), tb = $('#throwBtn');
  hb.classList.toggle('on', s.mode === 'HOOK');
  tb.classList.toggle('on', s.mode === 'THROW');
  hb.classList.toggle('cooling', s.hookCd > 0);
  tb.classList.toggle('cooling', s.throwCd > 0);
  const hc = $('#hookCd'), tc = $('#throwCd');
  hc.textContent = s.hookCd > 0 ? s.hookCd : '';
  tc.textContent = s.throwCd > 0 ? s.throwCd : '';
  hc.classList.toggle('ready', s.hookCd === 0);
  tc.classList.toggle('ready', s.throwCd === 0);
  for (const btn of document.querySelectorAll('.dir')) {
    const info = pv && pv.dirs[btn.dataset.dir];
    const ok = playable && info && info.valid;
    btn.classList.toggle('ok', !!ok && s.mode !== 'BASIC');
    btn.classList.toggle('bad', playable && info && !info.valid);
  }
}

/* ---------- оверлеи ---------- */
function perkCard(id, level) {
  const meta = E.PERKS.find(p => p.id === id);

      '<div class="ov-sub">' + (win ? 'Все 7 этажей зачищены. Остров держится на ваших толчках.' :
        'Герой сорвался или был добит. Остров ждёт следующую попытку.') + '</div>' +
      '<div class="ov-stats">Этаж: ' + s.floor + '/' + E.MAX_FLOOR + '<br>Побед: ' + s.kills +

/* ---------- главный рендер ---------- */
function render(s, events, showPreview) {
  const tileNodes = tilesEl.children;
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++)
    tileNodes[y * 5 + x].className = 'tile t-' + s.grid[y][x];
  renderUnits(s);
  const pv = E.preview(s);
  buildTelegraph(s, pv, !!showPreview);
  renderHud(s);
  renderControls(s, pv);
  renderOverlay(s);
  renderTutorial(s);
  if (events && events.length) playFx(events);
}

/* ---------- ввод ---------- */
function newRun() {
  state = E.createGame(pickSeed());
  for (const [, n] of Array.from(unitNodes)) n.remove();
  unitNodes.clear();
  fxSvg.innerHTML = ''; fxEl.innerHTML = '';
  modal = null; busy = false;
  save(); render(state, [], true);
}
function toggleMode(mode) {
  if (busy || modal || state.phase !== 'PLAYER') return;
  const ns = E.setMode(state, mode);
  if (ns.mode === state.mode) {
    const cd = mode === 'HOOK' ? state.hookCd : state.throwCd;
    toast(cd > 0 ? 'ОТКАТ: ' + cd + ' ХОДА' : 'РЕЖИМ НЕДОСТУПЕН');
    shake();
    return;
  }
  state = ns; save(); render(state, [], true);
  vibrate(15);
}
async function doAction(action) {
  if (busy || modal || state.phase !== 'PLAYER') return;
  const res = E.performTurn(state, action);
  if (!res.spent) { render(res.state, res.frames[0].events, true); vibrate(15); return; }
  busy = true;
  vibrate(15);
  for (let i = 0; i < res.frames.length; i++) {
    const f = res.frames[i];
    render(f.state, f.events, false);
    if (i < res.frames.length - 1) await sleep(185);
  }
  state = res.state;
  save();
  advanceTutorial(true);       // интерактивные шаги обучения завершаются реальным ходом
  render(state, [], true);
  busy = false;
}
const doDir = key => doAction({ type:'DIR', dir:key });

for (const btn of document.querySelectorAll('.dir'))
  btn.addEventListener('click', () => { if (suppressClick) return; doDir(btn.dataset.dir); });
$('#hookBtn').addEventListener('click', () => { if (suppressClick) return; toggleMode('HOOK'); });
$('#throwBtn').addEventListener('click', () => { if (suppressClick) return; toggleMode('THROW'); });
$('#waitBtn').addEventListener('click', () => { if (suppressClick) return; doAction({ type:'WAIT' }); });
$('#restartBtn').addEventListener('click', () => { if (suppressClick) return; modal = 'restart'; renderOverlay(state); });
$('#legendBtn').addEventListener('click', () => { if (suppressClick) return; modal = 'legend'; renderOverlay(state); });
$('#helpBtn').addEventListener('click', () => { if (suppressClick) return; modal = 'help'; renderOverlay(state); });
$('#diffBtn').addEventListener('click', () => { if (suppressClick) return; modal = 'difficulty'; renderOverlay(state); });

overlay.addEventListener('click', e => {
  if (suppressClick) return;
  const dl = e.target.closest('[data-diff]');
  if (dl) {
    const n = Number(dl.dataset.diff);
    if (n === difficulty) { modal = null; renderOverlay(state); toast('УРОВЕНЬ ' + n + ' УЖЕ ВЫБРАН'); return; }
    pendingDifficulty = n;
    if (state.phase === 'PLAYER' && state.turn > 1) { modal = 'difficulty-confirm'; renderOverlay(state); }
    else applyDifficulty(n);
    return;
  }
  const perk = e.target.closest('[data-perk]');
  if (perk) {
    state = E.choosePerk(state, perk.dataset.perk);
    save(); render(state, [], true);
    toast('ЭТАЖ ' + state.floor + ' · ВПЕРЁД');
    return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'new') newRun();
  else if (act.dataset.act === 'difficulty') { modal = 'difficulty'; renderOverlay(state); }
  else if (act.dataset.act === 'diff-apply') applyDifficulty(pendingDifficulty);
  else if (act.dataset.act === 'legend') { modal = 'legend'; renderOverlay(state); }
  else if (act.dataset.act === 'tutorial') {
    try { localStorage.removeItem(TUT_KEY); } catch (e) {}
    tutActive = true; tutStep = 0; tutRendered = -2; modal = null;
    renderTutorial();
    render(state, [], true);
    toast('ОБУЧЕНИЕ ЗАНОВО');
  }
  else { modal = null; renderOverlay(state); }
});

$('#tutorial').addEventListener('click', e => {
  if (suppressClick) return;
  if (e.target.closest('[data-tut="legend"]')) { modal = 'legend'; renderOverlay(state); return; }
  if (e.target.closest('[data-tut="skip"]')) { finishTutorial(); toast('ОБУЧЕНИЕ ПРОПУЩЕНО'); return; }
  if (e.target.closest('[data-tut="next"]')) advanceTutorial(false);
});

/* Свайп в ЛЮБОЙ точке экрана, порог 30px. */
document.addEventListener('pointerdown', e => {
  swipeStart = { x:e.clientX, y:e.clientY, id:e.pointerId };
}, { passive:true });
document.addEventListener('pointerup', e => {
  if (!swipeStart) return;
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
  swipeStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 320);
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'RIGHT' : 'LEFT') : (dy > 0 ? 'DOWN' : 'UP');
  doDir(dir);
}, { passive:true });
document.addEventListener('pointercancel', () => { swipeStart = null; }, { passive:true });

/* Клавиатура — для десктопа и доступности. */
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (modal) {
    if (k === 'escape') { modal = null; renderOverlay(state); }
    return;
  }
  if (k === 'arrowup' || k === 'w') doDir('UP');
  else if (k === 'arrowdown' || k === 's') doDir('DOWN');
  else if (k === 'arrowleft' || k === 'a') doDir('LEFT');
  else if (k === 'arrowright' || k === 'd') doDir('RIGHT');
  else if (k === '1') toggleMode('HOOK');
  else if (k === '2') toggleMode('THROW');
  else if (k === '3' || k === ' ') doAction({ type:'WAIT' });
  else if (k === 'r') { modal = 'restart'; renderOverlay(state); }
  else if (k === 'l' || k === 'д') { modal = 'legend'; renderOverlay(state); }
  else if (k === '?' || k === 'h') { modal = 'help'; renderOverlay(state); }
  else if (k === 'c' || k === 'с') { modal = 'difficulty'; renderOverlay(state); }
  else return;
  e.preventDefault();
});

save();                                   // мгновенное автосохранение: сразу при старте
render(state, [], true);
if (restored) toast('ПАРТИЯ ВОССТАНОВЛЕНА · ЭТАЖ ' + state.floor);
else toast('СВАЙП ИЛИ КРЕСТОВИНА — ВАШ ХОД');
})();
</script>

  var proto = location.protocol, host = location.hostname;
  var local = proto === 'http:' && (host === 'localhost' || host === '127.0.0.1' || host === '[::1]');
  if (proto !== 'https:' && !local) return;
  window.addEventListener('load', function () {
    var script = new URL('sw.js', location.href).href;
    var scope = new URL('./', location.href).href;
